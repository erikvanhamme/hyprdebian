# The dark theme and the font of the GTK 3 programs that do not read them from dconf, as the ones
# on XWayland, which have no XSETTINGS: the same as /etc/dconf/db/local.d. The settings of dconf
# and of the desktop portals take the place of these. Installed by hd-desktop.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita
gtk-font-name=JetBrainsMono NFM Medium 11
