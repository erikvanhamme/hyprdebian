# The dark theme and the font of the GTK 4 programs that do not read them from dconf, as the ones
# on XWayland, which have no XSETTINGS: the same as /etc/dconf/db/local.d. The settings of dconf
# and of the desktop portals take the place of these. libadwaita takes the dark mode from the
# desktop portals. Installed by hd-desktop.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-font-name=JetBrainsMono NFM Medium 11
