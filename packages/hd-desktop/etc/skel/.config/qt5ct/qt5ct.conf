; The settings of the Qt 5 applications, for qt5ct: the Fusion style in the colours of the dark
; GTK theme Adwaita-dark, the font of HyprDebian and the file chooser of GTK, through the desktop
; portals, as the GTK applications have them. Installed by hd-desktop; qt5ct changes them and
; drops this comment.
[Appearance]
color_scheme_path=/usr/share/qt5ct/colors/hyprdebian.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=xdgdesktopportal
style=Fusion

[Fonts]
fixed="JetBrainsMono NFM,11,-1,5,57,0,0,0,0,0,Medium"
general="JetBrainsMono NFM,11,-1,5,57,0,0,0,0,0,Medium"
