; The settings of the Qt 5 applications, for qt5ct: the Fusion style in the colours of the
; HyprDebian theme, which hd-theme --apply writes in colors/hd-theme.conf, the font of HyprDebian
; and the file chooser of GTK, through the desktop portals, as the GTK applications have them.
; Installed by hd-desktop; qt5ct changes them and drops this comment.
[Appearance]
color_scheme_path=~/.config/qt5ct/colors/hd-theme.conf
custom_palette=true
icon_theme=Adwaita
standard_dialogs=xdgdesktopportal
style=Fusion

[Fonts]
fixed="JetBrainsMono NFM,11,-1,5,57,0,0,0,0,0,Medium"
general="JetBrainsMono NFM,11,-1,5,57,0,0,0,0,0,Medium"
