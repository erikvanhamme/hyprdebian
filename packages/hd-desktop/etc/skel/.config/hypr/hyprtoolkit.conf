# The look of the hyprtoolkit programs, the dialogs of Hyprland in hyprland-guiutils: the colours,
# the fonts and the radius of the HyprDebian theme, written by hd-theme --apply in
# hd-theme-hyprtoolkit.conf, and the icons of the GTK and Qt applications. Settings after the
# source line take the place of the theme. Installed by hd-desktop.
source = ~/.config/hypr/hd-theme-hyprtoolkit.conf
icon_theme = Adwaita
