# The variables $hd_... of the HyprDebian theme, written by hd-theme --apply.
source = ~/.config/hypr/hd-theme-hyprlock.conf

general {
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $hd_dark
    outer_color = $hd_highlight
    outline_thickness = $hd_border

    font_family = $hd_font
    font_color = $hd_light

    placeholder_text = Enter Password
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = $hd_radius
    shadow_passes = 0
    fade_on_empty = false
}
