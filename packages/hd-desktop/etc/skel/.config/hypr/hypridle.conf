general {
    ignore_dbus_inhibit = false
}

listener {
    timeout = 120
    on-timeout = pidof hyprlock || /usr/bin/hd-launch-screensaver || true
}

listener {
    timeout = 240
    # Only start hyprlock when none is running. A second hyprlock cannot get the
    # session lock and hangs forever, which makes the pidof check above skip the
    # screensaver from then on.
    on-timeout = /usr/bin/hd-kill-screensaver; pidof hyprlock || hyprlock
}

listener {
    timeout = 245
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

