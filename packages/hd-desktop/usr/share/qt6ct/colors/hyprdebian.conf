; The colours of the dark GTK theme Adwaita-dark of GTK 3, for the Qt 6 applications: the window,
; the views, the text, the selection and the links as GTK has them, the disabled text half as
; bright. Installed by hd-desktop. The colours are in the order of the roles of QPalette:
; WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText, ButtonText, Base, Window,
; Shadow, Highlight, HighlightedText, Link, LinkVisited, AlternateBase, NoRole, ToolTipBase,
; ToolTipText and PlaceholderText.
