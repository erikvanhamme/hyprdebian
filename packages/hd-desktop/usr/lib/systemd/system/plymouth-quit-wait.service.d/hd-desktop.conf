# greetd.service starts after plymouth-quit-wait.service, whose plymouth --wait waits until
# plymouth is gone. When hd-plymouth-handoff.service hands the splash over to Hyprland, plymouth
# only quits once Hyprland runs, so this returns at once then; otherwise it runs plymouth --wait.
# See hd-plymouth-handoff in /usr/libexec/hd-desktop.
[Unit]
After=hd-plymouth-handoff.service

[Service]
ExecStart=
ExecStart=-/usr/libexec/hd-desktop/hd-plymouth-handoff wait
