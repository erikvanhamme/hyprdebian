# Writes /etc/greetd/config.toml before greetd starts, so a user that was made after hd-desktop
# was installed, as by the installer, is logged in to Hyprland at the boot. With the -, greetd
# starts with the config it has when this fails. See hd-desktop-render(8).
#
# The session runs on tty1, the VT of the boot splash, in the place of getty@tty1.service, and
# hd-plymouth-handoff.service hands the splash over to it. greetd has no VT of its own, as its
# config has vt = "none", so it does not switch the VT to text mode; pam_systemd takes the VT of
# the session from XDG_VTNR. See hd-plymouth(7).
[Unit]
Wants=hd-plymouth-handoff.service
After=hd-plymouth-handoff.service getty@tty1.service
Conflicts=getty@tty1.service

[Service]
ExecStartPre=-/usr/sbin/hd-desktop-render
Environment=XDG_VTNR=1
