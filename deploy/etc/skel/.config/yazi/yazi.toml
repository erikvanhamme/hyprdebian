[opener]

# Video

mpv_open = [
  { run = 'mpv %s', orphan = true, desc = "Open (MPV)" },
]

# Audio

audacious_open = [
  { run = 'audacious %s', orphan = true, desc = "Open (Audacious)" },
]

audacious_enqueue = [
  { run = 'audacious --enqueue %s', orphan = true, desc = "Enqueue (Audacious)" },
]

# Images

imv_open = [
  { run = 'imv-wayland %s', orphan = true, desc = "Open (Imv)" },
]

[open]

rules = [
  { mime = "video/*", use = "mpv_open" },
  { mime = "audio/*", use = ["audacious_open", "audacious_enqueue"] },
  { mime = "image/*", use = "imv_open" },
]

# Disable terminal preview rendering for network paths
[[plugin.prepend_previewers]]
url = "/stor/**"
run = "noop"

# Disable background preloading (fetching thumbnails, archive contents, etc.)
[[plugin.prepend_preloaders]]
url = "/stor/**"
run = "noop"

# Disable folder/file fetchers on the network mount
#[[plugin.prepend_fetchers]]
#url = "/stor/**"
#run = "noop"
