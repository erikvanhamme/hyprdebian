# Writes /etc/greetd/config.toml before greetd starts, so a user that was made after hd-desktop
# was installed, as by the installer, is logged in to Hyprland at the boot. With the -, greetd
# starts with the config it has when this fails. See hd-desktop-render(8).
[Service]
ExecStartPre=-/usr/sbin/hd-desktop-render
